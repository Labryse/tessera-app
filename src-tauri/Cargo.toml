[package]
name = "tessera"
version = "0.1.2"
description = "Tessera game library"
authors = []
license = "GPL-3.0-or-later"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "tessera_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
tokio = { version = "1", features = ["time", "sync"] }
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query", "rustls"] }
winreg = "0.56.0"
url = "2.5.8"
open = "5.4.5"
keyring = { version = "3", features = ["windows-native"] }
lnk = "0.6.4"
tauri-plugin-dialog = "2"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
crc32fast = "1.5.5"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
sha2 = "0.11.1"
base64 = "0.23.1"
getrandom = "0.3"
md-5 = "0.11.0"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
